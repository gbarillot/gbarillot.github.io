name: pme-plus

services:
  website:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: npm run dev -- --host 0.0.0.0
    environment:
      DOCKER_CLI_HINTS: 'false'
      TZ: Europe/Paris
    volumes:
      - ../:/home/nodeUser/pme-plus:cached
      - node_modules:/home/nodeUser/pme-plus/node_modules
    ports:
      - '4321:4321'

volumes:
  node_modules:
